name: PowerShell checks

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $AnalysisResults = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($AnalysisResults) {
            $AnalysisResults | Format-List
            exit 1
          }
